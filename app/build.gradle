plugins { id 'com.android.application' }

android {
    namespace 'kr.fishmap.app'
    compileSdk 35
    defaultConfig {
        applicationId 'kr.fishmap.app'
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName '1.13'
    }
    // 항상 같은 서명으로 만들어야 폰에서 '업데이트'가 됨 (개인용 비공개 저장소에 함께 보관)
    signingConfigs {
        fixed {
            storeFile file('fishmap.keystore')
            storePassword 'fishmap123'
            keyAlias 'fishmap'
            keyPassword 'fishmap123'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        release { signingConfig signingConfigs.fixed }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
