name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true     # DB/BADA2024_v1.1.txt.gz (수심 원본)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Leaflet 내장 (인터넷 약한 곳에서도 앱 화면이 뜨게)
        run: |
          mkdir -p app/src/main/assets/lib/images
          curl -fsSL -o app/src/main/assets/lib/leaflet.min.js https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js
          curl -fsSL -o app/src/main/assets/lib/leaflet.min.css https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css
          for f in layers.png layers-2x.png marker-icon.png marker-icon-2x.png marker-shadow.png; do
            curl -fsSL -o app/src/main/assets/lib/images/$f https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/$f
          done
          ls -la app/src/main/assets/lib
      - name: 섬 다리 자료 (REQ-60, 지도 서버가 붐비면 지난 자료 씀)
        continue-on-error: true
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/old
          gh release download --pattern bridges.json --dir /tmp/old || echo "지난 자료 없음"
          python3 tools/make_bridges.py --assets app/src/main/assets --out app/src/main/assets/bridges.json --old /tmp/old/bridges.json
          ls -la app/src/main/assets/bridges.json
      - name: 수심 타일 생성 (전국, BADA2024 → assets/depth)
        continue-on-error: true
        timeout-minutes: 20
        run: |
          pip install -q numpy
          python3 tools/make_depth_tiles.py --src DB/BADA2024_v1.1.txt.gz --out app/src/main/assets/depth
          echo "타일 $(ls app/src/main/assets/depth/*.json | grep -v index | wc -l)개, $(du -sh app/src/main/assets/depth | cut -f1)"
      - name: versionCode를 빌드 번호로 (Play 중복 업로드 방지)
        run: |
          sed -i "s/versionCode .*/versionCode ${{ github.run_number }}/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle
      - name: Build
        run: gradle assembleDebug bundleRelease --no-daemon --stacktrace
      - name: Rename
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk fishmap-${{ github.run_number }}.apk
          cp app/build/outputs/bundle/release/app-release.aab fishmap-${{ github.run_number }}.aab
      - name: HTML 한 파일 버전 (REQ-50, 브라우저로 여는 물흐름 지도)
        run: |
          V=$(grep versionName app/build.gradle | grep -o "'[^']*'" | tr -d "'")
          python3 tools/build_web.py --version "$V (build-${{ github.run_number }})" --out fishmap-${{ github.run_number }}.html
      - uses: actions/upload-artifact@v4
        with:
          name: fishmap-apk
          path: fishmap-${{ github.run_number }}.apk
      - name: Release (폰에서 받기 쉽게)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 바다흐름지도 ${{ github.run_number }}
          body: |
            - fishmap-${{ github.run_number }}.apk: 안드로이드 앱 (설치)
            - fishmap-${{ github.run_number }}.aab: Play Console 내부 테스트에 올리는 파일
            - fishmap-${{ github.run_number }}.html: 설치 없이 브라우저로 여는 HTML 한 파일 버전 (폰에 받아 내 파일 → 크롬/삼성 인터넷으로 열기)
          files: |
            fishmap-${{ github.run_number }}.apk
            fishmap-${{ github.run_number }}.html
            fishmap-${{ github.run_number }}.aab
            app/src/main/assets/bridges.json
          make_latest: true
