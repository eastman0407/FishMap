name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk fishmap-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fishmap-apk
          path: fishmap-${{ github.run_number }}.apk
      - name: Release (폰에서 받기 쉽게)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 물흐름 지도 ${{ github.run_number }}
          body: 이 APK를 폰에서 받아 설치하세요.
          files: fishmap-${{ github.run_number }}.apk
          make_latest: true
